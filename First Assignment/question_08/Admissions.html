<!doctype html>
<html>
  <head>
    <title>Admissions</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header><h1>Admission Form</h1></header>

    <section>
      <form>
        Name: <input type="text" /><br /><br />
        DOB: <input type="date" /><br /><br />
        Course:
        <select>
          <option>B.Sc CS</option>
          <option>B.Com</option>
          <option>BBA</option></select
        ><br /><br />
        Gender:
        <input type="radio" />Male <input type="radio" />Female<br /><br />
        <input type="submit" />
      </form>
    </section>
  </body>
</html>
